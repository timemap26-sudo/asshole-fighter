<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>混蛋快打 Asshole Fighter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="game"></canvas></div>

  <div id="controls">
    <div class="pad-move">
      <button data-hold="left" aria-label="左移">◀</button>
      <button data-hold="right" aria-label="右移">▶</button>
    </div>
    <div class="pad-atk">
      <button data-btn="slap" class="b-slap">巴掌<small>J</small></button>
      <button data-btn="punch" class="b-punch">拳頭<small>K</small></button>
      <button data-btn="kick" class="b-kick">踢腿<small>L</small></button>
      <button data-btn="throw" class="b-throw">過肩摔<small>I</small></button>
      <button data-btn="chain" class="b-chain" id="btn-chain">連環技<small>U / 空白</small></button>
    </div>
  </div>

  <div id="help">
    <div class="combos">
      <b>連環技指令</b>
      <span><kbd>J</kbd><kbd>J</kbd><kbd>J</kbd> 連環巴掌</span>
      <span><kbd>K</kbd><kbd>K</kbd><kbd>K</kbd> 百裂拳</span>
      <span><kbd>J</kbd><kbd>K</kbd><kbd>L</kbd> 沖天拳</span>
      <span><kbd>L</kbd><kbd>L</kbd><kbd>I</kbd> 地獄摔</span>
      <span><kbd>U</kbd> 連環技・怒氣滿時變<b class="hot">終極連環技</b></span>
      <span><kbd>A</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>→</kbd> 移動</span>
    </div>
    <div class="opts">
      <button id="btn-voice">🔊 求饒語音:開</button>
      <button id="btn-change">🙂 換張臉</button>
    </div>
  </div>
</div>

<div id="setup" class="modal show">
  <div class="card">
    <h1>混蛋快打 <span>ASSHOLE FIGHTER</span></h1>
    <p class="sub">上傳那個人的大頭照,他就會變成任你處置的魁儡。<br>他不會還手,只會一直求饒…直到徹底崩潰。</p>
    <div class="editor-wrap">
      <canvas id="editor" width="560" height="560"></canvas>
      <div class="hint">拖曳移動・滾輪 / 雙指縮放<br>把<b>眼睛</b>和<b>嘴巴</b>對準黃色虛線</div>
    </div>
    <label class="upload">📷 上傳大頭照<input type="file" id="file" accept="image/*"></label>
    <div class="sliders">
      <label>縮放 <input type="range" id="zoom" min="0.3" max="5" step="0.01" value="1"></label>
      <label>旋轉 <input type="range" id="rotate" min="-45" max="45" step="1" value="0"></label>
      <label>名字 <input type="text" id="name" maxlength="12" value="那個混蛋"></label>
    </div>
    <button id="start" class="big">開打!</button>
    <p class="privacy">照片只在你的瀏覽器裡處理,不會上傳到任何地方。</p>
  </div>
</div>

<div id="end" class="modal">
  <div class="card">
    <h2 id="end-title">K.O.</h2>
    <p id="end-sub"></p>
    <p id="end-stats"></p>
    <div class="row-btns">
      <button id="again" class="big">再打一次</button>
      <button id="change">換張臉</button>
    </div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
